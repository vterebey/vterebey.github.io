<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Referer</title>
</head>
<body>
  <h1>Click to go to proxy</h1>
  <a href="https://my-fit-life.com/group-a/?utm_source=test&utm_campaign=ARAB" target="_blank">
    Go to Proxy
  </a>
  <br>
  <button id="jsFetch">Send JS Fetch</button>

  <script>
    document.getElementById('jsFetch').addEventListener('click', () => {
      fetch('https://my-fit-life.com/group-a/?utm_source=test&utm_campaign=ARAB', {
        method: 'GET',
        headers: {
          'Referer': 'https://www.facebook.com/' // только для JS fetch
        },
        mode: 'cors',  // если сервер поддерживает CORS
      }).then(res => res.text()).then(console.log);
    });
  </script>
</body>
</html>
